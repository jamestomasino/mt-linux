[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mt-linux"
version = "0.1.0"
description = "Linux meeting transcriber daemon and CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OpenAI Codex" }]
dependencies = [
  "caldav>=1.3",
  "click>=8.1",
  "faster-whisper>=1.0",
  "google-api-python-client>=2.0",
  "google-auth-httplib2>=0.2",
  "google-auth-oauthlib>=1.0",
  "httpx>=0.25",
  "numpy>=1.24",
  "psutil>=5.9",
  "pyannote.audio>=3.1",
  "resemblyzer>=0.1.3",
  "rich>=13.0",
  "scipy>=1.10",
  "sounddevice>=0.4",
  "torch>=2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
mt-linux = "mt_linux.__main__:main"
mt-ctl = "mt_linux.cli:cli"

[tool.setuptools.packages.find]
include = ["mt_linux*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
